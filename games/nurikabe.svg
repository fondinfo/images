    <text x="220" y="68">2</text>
    <text x="60"  y="108">2</text>
    <text x="180" y="188" fill="#000">3</text>
    <text x="140" y="228">7</text>
  </g>

  <!-- puntini -->
  <g fill="#000">
    <circle cx="140" cy="140" r="3"/>
    <circle cx="180" cy="140" r="3"/>
    <circle cx="100" cy="220" r="3"/>
