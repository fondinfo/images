<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" font-family="Arial, sans-serif" font-size="22" text-anchor="middle">
  <rect width="240" height="240" fill="#fff"/>

  <!-- celle nere -->
  <g fill="#000">
    <rect x="120" y="80"  width="40" height="40"/>
    <rect x="160" y="80"  width="40" height="40"/>
    <rect x="200" y="80"  width="40" height="40"/>
    <rect x="80"  y="120" width="40" height="40"/>
    <rect x="200" y="120" width="40" height="40"/>
    <rect x="200" y="160" width="40" height="40"/>
    <rect x="160" y="200" width="40" height="40"/>
    <rect x="200" y="200" width="40" height="40"/>
  </g>

  <!-- griglia -->
  <g stroke="#000" stroke-width="1">
    <path d="M0 0H240M0 40H240M0 80H240M0 120H240M0 160H240M0 200H240M0 240H240"/>
    <path d="M0 0V240M40 0V240M80 0V240M120 0V240M160 0V240M200 0V240M240 0V240"/>
  </g>

  <!-- numeri -->
  <g fill="#000">
