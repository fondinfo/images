<svg width="520" height="470" viewBox="0 0 520 470" xmlns="http://www.w3.org/2000/svg"><style>text{font-family:system-ui,-apple-system,sans-serif}.c{fill:#fff;stroke:#f59e0b;stroke-width:2.5;rx:8px}.h{fill:#fef3c7;stroke:#d97706;stroke-width:3.5;rx:8px}.n{font-size:32px;font-weight:800;fill:#b45309;text-anchor:middle;dominant-baseline:central}.l{font-size:15px;font-weight:700;fill:#92400e;text-anchor:middle;dominant-baseline:central}.s{font-size:12px;fill:#d97706}.d{font-size:16px;fill:#78350f;font-weight:700}.b{font-weight:800;fill:#b45309}</style><rect width="520" height="470" fill="#fffbeb" /><g transform="translate(85,65)"><text x="50" y="-22" class="l">col 0</text><text x="150" y="-22" class="l">col 1</text><text x="250" y="-22" class="l">col 2</text><text x="350" y="-22" class="l">col 3</text><text x="50" y="-7" class="l s">(rem 0)</text><text x="150" y="-7" class="l s">(rem 1)</text><text x="250" y="-7" class="l s">(rem 2)</text><text x="350" y="-7" class="l s">(rem 3)</text><text x="-28" y="50" class="l">row 0</text><text x="-28" y="150" class="l">row 1</text><text x="-28" y="250" class="l">row 2</text><text x="-28" y="68" class="l s">(quot 0)</text><text x="-28" y="168" class="l s">(quot 1)</text><text x="-28" y="268" class="l s">(quot 2)</text><rect width="90" height="90" class="c" /><text x="45" y="45" class="n">0</text><rect x="100" width="90" height="90" class="c" /><text x="145" y="45" class="n">1</text><rect x="200" width="90" height="90" class="c" /><text x="245" y="45" class="n">2</text><rect x="300" width="90" height="90" class="c" /><text x="345" y="45" class="n">3</text><rect y="100" width="90" height="90" class="c" /><text x="45" y="145" class="n">4</text><rect x="100" y="100" width="90" height="90" class="c" /><text x="145" y="145" class="n">5</text><rect x="200" y="100" width="90" height="90" class="h" /><text x="245" y="145" class="n">6 ✨</text><rect x="300" y="100" width="90" height="90" class="c" /><text x="345" y="145" class="n">7</text><rect y="200" width="90" height="90" class="c" /><text x="45" y="245" class="n">8</text><rect x="100" y="200" width="90" height="90" class="c" /><text x="145" y="245" class="n">9</text><rect x="200" y="200" width="90" height="90" class="c" /><text x="245" y="245" class="n">10</text><rect x="300" y="200" width="90" height="90" class="c" /><text x="345" y="245" class="n">11</text><line x1="245" y1="100" x2="245" y2="-15" stroke="#f59e0b" stroke-dasharray="5,5" stroke-width="2" /><line x1="200" y1="145" x2="-10" y2="145" stroke="#f59e0b" stroke-dasharray="5,5" stroke-width="2" /></g><rect x="30" y="368" width="445" height="85" rx="12" fill="#fff" stroke="#fbbf24" stroke-width="2" /><text x="46" y="392" font-size="17" font-weight="800" fill="#b45309">🎯 Spotlight on number 6:</text><text x="46" y="417" class="d">6 ÷ 4 = Quotient <tspan class="b">1</tspan> (Row 1) | Rem <tspan class="b">2</tspan> (Col 2)</text><text x="46" y="440" class="d">Formula: <tspan class="b">x + y * col</tspan> ➔ 2 + (1 * 4) = <tspan class="b">6</tspan> ✨</text></svg>