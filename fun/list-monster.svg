<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 510" width="100%" height="100%">
  <defs>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .label-text {
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
      font-weight: bold;
      font-size: 24px;
      fill: #2C3E50;
      text-anchor: middle;
    }
    .bracket-line {
      stroke: #34495E;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <g transform="translate(15, 45)">
    <!-- ================= ZAMPINE A COPPIE SOTTO OGNI SEGMENTO ================= -->
    <g filter="url(#drop-shadow)">
      <!-- Coppia sotto il segmento 2 -->
      <path d="M 275 235 Q 260 270 250 275 Q 240 280 250 292 Q 265 295 285 270 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 305 235 Q 290 270 280 275 Q 270 280 280 292 Q 295 295 315 270 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Coppia sotto il segmento 3 -->
      <path d="M 395 235 Q 380 270 370 275 Q 360 280 370 292 Q 385 295 405 270 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 425 235 Q 410 270 400 275 Q 390 280 400 292 Q 415 295 435 270 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Coppia sotto il segmento 4 -->
      <path d="M 515 235 Q 500 270 490 275 Q 480 280 490 292 Q 505 295 525 270 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 545 235 Q 530 270 520 275 Q 510 280 520 292 Q 535 295 555 270 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2.5" stroke-linejoin="round" />

      <!-- Coppia sotto il segmento Last -->
      <path d="M 635 235 Q 620 270 610 275 Q 600 280 610 292 Q 625 295 645 270 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2.5" stroke-linejoin="round" />
      <path d="M 665 235 Q 650 270 640 275 Q 630 280 640 292 Q 655 295 675 270 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2.5" stroke-linejoin="round" />
    </g>

    <!-- ================= CORPO DEL BRUCO ================= -->
    <g filter="url(#drop-shadow)">
      <!-- Segmento Last -->
      <path d="M 595 190 C 595 130 650 125 695 150 C 735 175 730 230 695 240 C 640 250 595 230 595 190 Z" fill="#7CB342" stroke="#33691E" stroke-width="3" stroke-linejoin="round" />
      <path d="M 615 152 Q 650 138 680 156" fill="none" stroke="#DCEDC8" stroke-width="5" stroke-linecap="round" opacity="0.7" />

      <!-- Segmento 4 -->
      <path d="M 475 190 C 475 130 530 125 575 150 C 615 175 610 230 575 240 C 520 250 475 230 475 190 Z" fill="#7CB342" stroke="#33691E" stroke-width="3" stroke-linejoin="round" />
      <path d="M 495 152 Q 530 138 560 156" fill="none" stroke="#DCEDC8" stroke-width="5" stroke-linecap="round" opacity="0.7" />

      <!-- Segmento 3 -->
      <path d="M 355 190 C 355 130 410 125 455 150 C 495 175 490 230 455 240 C 400 250 355 230 355 190 Z" fill="#7CB342" stroke="#33691E" stroke-width="3" stroke-linejoin="round" />
      <path d="M 375 152 Q 410 138 440 156" fill="none" stroke="#DCEDC8" stroke-width="5" stroke-linecap="round" opacity="0.7" />

      <!-- Segmento 2 -->
      <path d="M 235 190 C 235 130 290 125 335 150 C 375 175 370 230 335 240 C 280 250 235 230 235 190 Z" fill="#7CB342" stroke="#33691E" stroke-width="3" stroke-linejoin="round" />
      <path d="M 255 152 Q 290 138 320 156" fill="none" stroke="#DCEDC8" stroke-width="5" stroke-linecap="round" opacity="0.7" />

      <!-- Testa / Head -->
      <path d="M 110 185 C 105 120 170 105 225 140 C 265 165 260 225 225 240 C 160 255 115 230 110 185 Z" fill="#7CB342" stroke="#33691E" stroke-width="3" stroke-linejoin="round" />
      <path d="M 140 135 Q 175 120 205 138" fill="none" stroke="#DCEDC8" stroke-width="5" stroke-linecap="round" opacity="0.8" />

      <!-- ANTENNE ARRICCIATE -->
      <path d="M 150 118 Q 135 80 115 85 Q 100 90 110 105" fill="none" stroke="#33691E" stroke-width="4" stroke-linecap="round" />
      <circle cx="110" cy="105" r="7" fill="#8BC34A" stroke="#33691E" stroke-width="2.5" />

      <path d="M 195 115 Q 215 75 235 85 Q 250 90 235 108" fill="none" stroke="#33691E" stroke-width="4" stroke-linecap="round" />
      <circle cx="235" cy="108" r="7" fill="#8BC34A" stroke="#33691E" stroke-width="2.5" />

      <!-- FACCINA SIMPATICA -->
      <circle cx="155" cy="165" r="13" fill="#FFFFFF" stroke="#33691E" stroke-width="2.5" />
      <circle cx="158" cy="163" r="5" fill="#2C3E50" />
      
      <circle cx="200" cy="162" r="13" fill="#FFFFFF" stroke="#33691E" stroke-width="2.5" />
      <circle cx="203" cy="160" r="5" fill="#2C3E50" />
      
      <!-- Guance paffute -->
      <circle cx="142" cy="188" r="9" fill="#FF8A80" opacity="0.8" />
      <circle cx="215" cy="185" r="9" fill="#FF8A80" opacity="0.8" />

      <!-- Sorrisetto con dentino -->
      <path d="M 155 190 Q 180 225 210 192" fill="#D32F2F" stroke="#33691E" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 175 202 L 185 202 L 185 212 L 175 212 Z" fill="#FFFFFF" stroke="#33691E" stroke-width="1.5" />
    </g>

    <!-- ================= PARENTESI ED ETICHETTE SUPERIORI ================= -->
    <path d="M 110 55 L 110 35 L 240 35 L 240 55" class="bracket-line" />
    <text x="175" y="17" class="label-text">head</text>

    <path d="M 255 55 L 255 35 L 730 35 L 730 55" class="bracket-line" />
    <text x="492" y="17" class="label-text">tail</text>

    <!-- ================= PARENTESI ED ETICHETTE INFERIORI ================= -->
    <path d="M 110 315 L 110 335 L 600 335 L 600 315" class="bracket-line" />
    <text x="355" y="372" class="label-text">init</text>

    <path d="M 615 315 L 615 335 L 730 335 L 730 315" class="bracket-line" />
    <text x="672" y="372" class="label-text">last</text>
  </g>
</svg>